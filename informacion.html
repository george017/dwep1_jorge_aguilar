<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFPEM - Información para Estudiantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --usac-guinda: #7d2027; 
            --usac-tan: #c2a385;   
        }
        .bg-usac { background-color: var(--usac-guinda) !important; }
        .btn-usac { background-color: var(--usac-guinda); color: white; border: none; }
        .btn-usac:hover { background-color: #5a171c; color: white; }
        .nav-link { color: white !important; }
        .nav-link.active { font-weight: bold; text-decoration: underline; }

        /* Tarjeta de noticia */
        .noticia-card {
            background-color: var(--usac-tan);
            border: none;
            padding: 15px;
            height: 100%;
        }
        .noticia-img-container {
            background-color: #b09174;
            height: 220px;
            overflow: hidden;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .noticia-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .footer {
            background-color: var(--usac-guinda);
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        .social-icons a {
            font-size: 2rem;
            margin-left: 15px;
            transition: transform 0.2s;
            display: inline-block;
        }
        .social-icons a:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <header class="container d-flex justify-content-between align-items-center py-3">
        <img src="img/logo-efpem.png" alt="Logo EFPEM" style="height: 75px;"> <img src="img/logo-usac.png" alt="Logo USAC" style="height: 75px;"> </header>

    <nav class="navbar navbar-expand-lg bg-usac">
        <div class="container">
            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="informacion.html">Información</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-end my-3 social-icons">
        <a href="https://www.facebook.com/efpemusac" target="_blank" class="text-primary" title="Facebook EFPEM">
            <i class="bi bi-facebook"></i>
        </a>
        <a href="https://twitter.com/usacenlinea" target="_blank" class="text-info" title="Twitter USAC">
            <i class="bi bi-twitter"></i>
        </a>
        <a href="mailto:info@efpem.usac.edu.gt" class="text-warning" title="Contactar por Correo">
            <i class="bi bi-envelope-at-fill"></i>
        </a>
    </div>

    <main class="container mb-5">
        <h2 class="text-center fw-bold mb-4">Información para estudiantes</h2> <div class="row g-4">
            
            <div class="col-12 col-md-6"> <div class="noticia-card shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="m-0">Convocatoria 2026</h4>
                        <span class="badge bg-secondary">27/04/2026</span>
                    </div>
                    <div class="noticia-img-container">
                        <img src="img/convocatoria-01-2026.png" alt="Noticia 1"> </div>
                    <div class="text-center mt-3">
                        <button class="btn btn-usac rounded-pill px-5">Leer más...</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="noticia-card shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="m-0">Proceso de Graduación</h4>
                        <span class="badge bg-secondary">25/04/2026</span>
                    </div>
                    <div class="noticia-img-container">
                        <img src="img/proceso-graduacion.png" alt="Noticia 2">
                    </div>
                    <div class="text-center mt-3">
                        <button class="btn btn-usac rounded-pill px-5">Leer más...</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="noticia-card shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="m-0">Horarios Segundo Semestre</h4>
                        <span class="badge bg-secondary">20/04/2026</span>
                    </div>
                    <div class="noticia-img-container">
                        <img src="img/horario-segundo-semestre.png" alt="Noticia 3">
                    </div>
                    <div class="text-center mt-3">
                        <button class="btn btn-usac rounded-pill px-5">Leer más...</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="noticia-card shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="m-0">Talleres de Computación</h4>
                        <span class="badge bg-secondary">15/04/2026</span>
                    </div>
                    <div class="noticia-img-container">
                        <img src="img/talleres-computacion-efpem.png" alt="Noticia 4">
                    </div>
                    <div class="text-center mt-3">
                        <button class="btn btn-usac rounded-pill px-5">Leer más...</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-1 fw-bold">Id y Enseñad a Todos</p>
            <p class="mb-0">2026 Escuela de Formación de Profesores de Enseñanza Media - EFPEM</p> </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
